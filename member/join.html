<body class="is-sub" data-page="join">
  <div data-include="header"></div>

  <main id="main">
    <section class="sub-visual">
      <div class="container">
        <h1 class="sub-visual__title">회원가입</h1>
        <ol class="breadcrumb" aria-label="현재 위치">
          <li><a href="../index.html">홈</a></li>
          <li>회원</li>
          <li aria-current="page">회원가입</li>
        </ol>
      </div>
    </section>

    <section class="sub-content">
      <div class="container">
        <div class="member">
          <p class="notice-box">회원 기능은 준비 중입니다. 현재는 화면만 제공됩니다. <!-- 2차: Supabase Auth 연동 --></p>
          <button class="btn btn--kakao btn--block" type="button" data-kakao-login>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#191919" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7l-1 3.7c-.1.3.3.6.6.4l4.4-2.9c.4 0 .9.1 1.3.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>
            카카오로 간편 가입</button>
          <div class="member__divider">또는 이메일로 가입</div>
          <form class="form" onsubmit="event.preventDefault(); alert('회원가입 기능은 준비 중입니다.');">
            <div class="form__row">
              <label class="form__label" for="join-name">이름<span class="req">*</span></label>
              <input class="form__input" id="join-name" type="text" autocomplete="name" required>
            </div>
            <div class="form__row">
              <label class="form__label" for="join-email">이메일<span class="req">*</span></label>
              <input class="form__input" id="join-email" type="email" autocomplete="email" required>
            </div>
            <div class="form__row">
              <label class="form__label" for="join-pw">비밀번호<span class="req">*</span></label>
              <input class="form__input" id="join-pw" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="form__row">
              <label class="form__label" for="join-phone">연락처</label>
              <input class="form__input" id="join-phone" type="tel" autocomplete="tel" placeholder="010-0000-0000">
            </div>
            <label class="form__agree"><input type="checkbox" required> [필수] 이용약관에 동의합니다. <!-- TODO: 이용약관 페이지 --></label>
            <label class="form__agree"><input type="checkbox" required> [필수] 개인정보 수집·이용에 동의합니다. <a href="../privacy.html">개인정보처리방침</a></label>
            <button class="btn btn--point btn--lg btn--block" type="submit">가입하기</button>
          </form>
          <div class="member__links">이미 회원이신가요? <a href="./login.html"><strong>로그인</strong></a></div>
        </div>
      </div>
    </section>
  </main>

  <div class="quick quick--float" data-include="quick" data-keep></div>
  <div data-include="footer"></div>
</body>
