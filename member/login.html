    <section class="sub-content">
      <div class="container">
        <div class="member">
          <p class="notice-box">회원 기능은 준비 중입니다. 현재는 화면만 제공됩니다. <!-- 2차: Supabase Auth 연동 --></p>

            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#191919" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7l-1 3.7c-.1.3.3.6.6.4l4.4-2.9c.4 0 .9.1 1.3.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>

          <form class="form" onsubmit="event.preventDefault(); alert('로그인 기능은 준비 중입니다.');">
            <div class="form__row">
              <label class="form__label" for="login-email">이메일</label>
              <input class="form__input" id="login-email" type="email" autocomplete="email" required>
            </div>
            <div class="form__row">
              <label class="form__label" for="login-pw">비밀번호</label>
              <input class="form__input" id="login-pw" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn--dark btn--lg btn--block" type="submit">로그인</button>
          </form>
          <div class="member__links"><a href="./join.html">회원가입</a><span aria-hidden="true">|</span><a href="#" onclick="alert('준비 중입니다.'); return false;">비밀번호 찾기</a></div>
