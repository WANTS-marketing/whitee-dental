<body class="is-sub has-lnb" data-page="faq">
  <div data-include="header"></div>

  <main id="main">
    <section class="sub-visual sub-visual--image">
      <div class="sub-visual__bg" aria-hidden="true"></div> <!-- 공통 배너 사진 assets/images/banner-sub.jpg (sub.css .sub-visual__bg) -->

      </div>
    </section>

    <!-- 서브 레이아웃: 왼쪽 LNB(하위 메뉴) + 오른쪽 본문 — 1024px 이하는 본문 위 가로 탭 (common.css '서브 LNB')
         FAQ 대메뉴 = 자주 묻는 질문(이 페이지, 배너 있음) + 상담문의(목록·작성, 배너 없음 — 글 먼저) -->
    <div class="sub-layout container">
      <aside class="lnb">
        <nav class="lnb__nav" aria-label="FAQ 하위 메뉴">
          <div class="lnb__head"><p class="lnb__title">FAQ</p><p class="lnb__en">Q&amp;A · CONTACT</p></div>
          <ul class="lnb__list">
            <li><a href="index.html" aria-current="page">자주 묻는 질문</a></li>
            <li><a href="contact.html">상담문의</a></li>
          </ul>
        </nav>
      </aside>
      <div class="sub-body">
        <div class="sub-head">
          <ol class="breadcrumb" aria-label="현재 위치">
            <li><a class="breadcrumb__home" href="../index.html" aria-label="홈"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v11h13V9"/></svg></a></li>
            <li>FAQ</li>
            <li aria-current="page">자주 묻는 질문</li>
          </ol>
          <h1 class="sub-head__title">자주 묻는 질문</h1>
          <p class="sub-head__desc">진료 전 궁금한 점을 먼저 확인해 보세요.</p>
        </div>

    <section class="sub-content">
      <div class="container faq-board">
        <!-- FAQ 게시판 (pages.js renderFaqList): 분류 칩 줄 → 도구 줄 [총 N개 질문 | 검색] → 질문 목록(아코디언) → 하단 상담 안내
             분류 칩 = 커뮤니티 게시판 분류 칩과 같은 모양(.board-cats, 선택 = --color-accent) — 항상 한 줄, 넘치면 가로 스크롤(스크롤바 숨김 + 오른쪽 끝 흐림)
             도구 줄 = 커뮤니티 게시판 도구 줄(.board-tools)과 같은 모양 -->
        <nav class="board-cats faq-cats" aria-label="FAQ 분류" data-faq-cats-wrap>
          <ul class="board-cats__list" data-faq-cats></ul>
        </nav>
        <div class="board-tools faq-tools">
          <p class="board-tools__count" data-faq-count aria-live="polite"></p>
          <form class="board-search faq-search" role="search" data-faq-search-form>
            <label class="sr-only" for="faq-search">FAQ 검색</label>
            <input class="board-search__input" id="faq-search" type="search" placeholder="궁금한 내용을 검색해 보세요" autocomplete="off" enterkeyhint="search" data-faq-search>
            <button class="board-search__btn" type="submit" aria-label="검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
          </form>
        </div>
        <ul class="faq-list" data-faq-list aria-live="polite"></ul>
        <!-- 하단 상담 안내 — 질문 목록 아래 56px, 버튼 = 상담문의 작성 페이지 -->
        <div class="faq-board__cta">
          <p class="faq-board__cta-text">찾으시는 답변이 없으신가요? 상담문의를 남겨주시면 빠르게 답변드리겠습니다.</p>
          <a class="btn faq-board__contact" href="./contact-write.html">상담문의하기 <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </section>
      </div>
    </div>
