<body class="is-sub">
  <div data-include="header"></div>

  <main id="main">
    <section class="sub-visual">
      <div class="container">
        <h1 class="sub-visual__title">임플란트</h1>
        <ol class="breadcrumb" aria-label="현재 위치">
          <li><a href="../index.html">홈</a></li>
          <li>진료과목</li>
          <li aria-current="page">임플란트</li>
        </ol>

          <a href="implant.html" class="is-current" aria-current="page">임플란트</a>

          <a href="aesthetic.html">심미치료</a>
        </nav>
      </div>
    </section>

    <section class="sub-content">
      <div class="container">
        <div class="preparing">
          <strong>콘텐츠 준비 중입니다</strong>
          <p>임플란트 내용은 병원 자료를 받은 뒤 채워질 예정입니다.</p>
        </div>
        <!-- 빠른상담 (전송: assets/js/api.js submitInquiry) -->
        <section class="quick-consult" aria-labelledby="qc-title">
          <h2 class="quick-consult__title" id="qc-title">빠른상담 신청</h2>
          <p class="quick-consult__desc">이름과 연락처를 남겨주시면 확인 후 연락드립니다.</p>
          <form class="form" data-inquiry-form="빠른상담" novalidate>
            <div class="form__row">
              <label class="form__label" for="qc-branch">지점<span class="req">*</span></label>
              <select class="form__select" id="qc-branch" name="branch" required>
                <option value="">지점 선택</option>
                <option value="changwon">창원점</option>
                <option value="masan">마산점</option>
              </select>
            </div>
            <div class="form__row">
              <label class="form__label" for="qc-treatment">진료과목<span class="req">*</span></label>
              <select class="form__select" id="qc-treatment" name="treatment" required>
                <option value="">진료과목 선택</option>
                <option selected>임플란트</option>
                <option>치아교정</option>
                <option>일반치료</option>
                <option>사랑니·스케일링</option>
                <option>심미치료</option>
                <option>기타</option>
              </select>
            </div>
            <div class="form__row">
              <label class="form__label" for="qc-name">이름<span class="req">*</span></label>
              <input class="form__input" id="qc-name" name="name" type="text" autocomplete="name" maxlength="20" required>
            </div>
            <div class="form__row">
              <label class="form__label" for="qc-phone">연락처<span class="req">*</span></label>
              <input class="form__input" id="qc-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" required>
            </div>
            <div class="form__hp" aria-hidden="true">
              <label for="qc-website">비워 두세요</label>
              <input id="qc-website" name="website" type="text" tabindex="-1" autocomplete="off">
            </div>
            <button class="btn btn--dark" type="submit">상담 신청</button>
            <label class="form__agree"><input type="checkbox" name="agree" required> [필수] 개인정보 수집·이용에 동의합니다. <a href="../privacy.html">개인정보처리방침</a></label>
            <p class="form__msg" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>
    </section>
  </main>

  <div class="quick quick--float" data-include="quick" data-keep></div>
