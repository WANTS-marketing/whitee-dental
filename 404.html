<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지를 찾을 수 없습니다 | 화이트e치과</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Pretendard Variable", Pretendard, sans-serif; color: #222; background: #fcfcfb; text-align: center; }
    strong { display: block; font-size: 64px; color: #16233f; /* 사이트 포인트 컬러(--color-point) — 이 페이지는 공통 CSS 를 읽지 않음 */ line-height: 1; }
    p { color: #666; }
    a { display: inline-block; margin-top: 16px; padding: 12px 28px; border-radius: 4px; /* = --radius-btn (이 페이지는 variables.css 를 읽지 않음) */ background: #212121; color: #fff; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <strong>404</strong>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 삭제된 페이지입니다.</p>
    <a id="home" href="/">홈으로 가기</a>
  </main>
  <script>
    // GitHub Pages 하위 경로(/whitee-dental/)와 자체 도메인 모두 대응
    var base = location.pathname.indexOf('/whitee-dental/') === 0 ? '/whitee-dental/' : '/';
    document.getElementById('home').href = base;
    // 기존 사이트(그누보드) 주소 → 새 주소 (도메인을 옮긴 뒤 예전 링크·검색 결과로 들어온 경우)
    //   /bbs/board.php?bo_table=story&wr_id=89 → community/news-view.html?id=story-89 (치과스토리 = 치과소식, assets/data/news.json 의 wrId)
    //   /bbs/board.php?bo_table=story          → community/news.html
    if (/\/bbs\/board\.php$/.test(location.pathname)) {
      var q = new URLSearchParams(location.search);
      if (q.get('bo_table') === 'story') {
        var id = parseInt(q.get('wr_id'), 10);
        location.replace(base + (id ? 'community/news-view.html?id=story-' + id : 'community/news.html'));
      }
    }
  </script>
</body>
</html>
